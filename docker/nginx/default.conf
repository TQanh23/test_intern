server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # mime.types của nginx chưa có .mjs. Worker của pdf.js là file .mjs, mà trình duyệt chỉ chạy module có MIME JavaScript.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
