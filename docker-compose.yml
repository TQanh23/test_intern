services:
  app:
    build: ./docker/php
    volumes:
      - .:/var/www/html
      # Bind-mounted vendor takes ~14s per request on Windows, so it lives in a volume.
      - vendor:/var/www/html/vendor
    depends_on:
      assets:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # php-fpm only listens once the entrypoint finishes; the first run installs dependencies.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10m

  # Chạy lệnh định kỳ trong routes/console.php, ví dụ chấm bài hết giờ mà học sinh bỏ dở.
  # Entrypoint chỉ cài dependency và migrate khi chạy php-fpm, nên container này đợi app sẵn sàng rồi dùng chung code và vendor.
  scheduler:
    build: ./docker/php
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # Trang Breeze dùng @vite, mà public/build không nằm trong git nên phải build khi khởi động.
  assets:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run build"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # DB ports are bound to loopback only: these are dev credentials and Mongo has no auth.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: exam
      MYSQL_USER: exam
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      # 27018 on the host: 27017 is often taken by a local MongoDB service.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vendor:
  node_modules:
  mysql_data:
  mongo_data:
